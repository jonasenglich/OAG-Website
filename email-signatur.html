<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAG E-Mail-Signatur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@300;400;900&display=swap" rel="stylesheet">
  <link href="https://openartgroup.de/networkand.css" rel="stylesheet">
  <style>
    body { margin: 0; padding: 40px 20px; background: #c8c5c0; font-family: sans-serif; }
    .preview-hint { text-align:center; color:#555; font-size:13px; margin-bottom:20px; }
  </style>
</head>
<body>

  <p class="preview-hint">Vorschau Signatur — Quellcode in IONOS HTML-Editor einfuegen.</p>

  <!-- ============================================================
       EMAIL BANNER START — diesen Block in die Signatur einfügen
       ============================================================ -->

  <table width="600" cellpadding="0" cellspacing="0" border="0" align="center"
    style="max-width:600px; width:100%; border-collapse:collapse; margin:0 auto;">

    <!-- ======================================================
         SEKTION 1: HERO — beige, großes Festival-Wortbild
         ====================================================== -->
    <tr>
      <td style="background:#f1eeea; padding:0;">
        <!-- position:relative + overflow:hidden → Scribble wird am unteren Rand abgeschnitten -->
        <div style="position:relative; overflow:hidden; padding:32px 24px 18px 24px;">

          <!-- Überschrift: normale Flusslayoout, bestimmt die Höhe der Box -->
          <div style="font-family:'Networkand','Permanent Marker',Impact,sans-serif;
                      font-size:64px; font-weight:400; color:#111111;
                      line-height:0.88; width:60%;">
            OPEN<br>ART<br>FESTIVAL
          </div>

          <!-- Scribble: absolut positioniert, ragt nach unten raus und wird abgeschnitten -->
          <img src="https://openartgroup.de/Ebene%202.png"
               alt="" width="310"
               style="display:block; position:absolute; right:0; top:0;
                      width:310px; height:auto;
                      mix-blend-mode:multiply; -webkit-mix-blend-mode:multiply;">

        </div>
      </td>
    </tr>

    <!-- ======================================================
         SEKTION 2: ORANGE BAR — Button · Frist · Datum/Ort
         ====================================================== -->
    <tr>
      <td style="background:#ce4918; padding:13px 20px;">
        <table width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>

            <!-- Button + Bewerbungsfrist in einer Zelle, direkt nebeneinander -->
            <td style="vertical-align:middle; white-space:nowrap;">
              <a href="https://www.openartgroup.de/teilnahme.html"
                 target="_blank" rel="noopener noreferrer"
                 style="display:inline-block;
                        background:#111111; color:#ffffff; text-decoration:none;
                        font-family:'Londrina Solid',sans-serif;
                        font-size:12px; font-weight:300; letter-spacing:0.03em;
                        padding:8px 18px; border-radius:50px; white-space:nowrap;">
                Zur Teilnahme
              </a>
              <span style="font-family:'Londrina Solid',sans-serif;
                           color:#ffffff; font-size:12px; font-weight:300;
                           margin-left:8px;">
                Bewerbungsfrist &middot; 1. Juni 2026
              </span>
            </td>

            <!-- Datum + Ort — WEISS, etwas größer -->
            <td style="vertical-align:middle; text-align:right; white-space:nowrap;">
              <div style="font-family:'Networkand','Permanent Marker',Impact,sans-serif;
                          color:#ffffff; font-size:17px; font-weight:400; line-height:1.2;">
                25.–26.07.2026
              </div>
              <div style="font-family:'Networkand','Permanent Marker',Impact,sans-serif;
                          color:#ffffff; font-size:17px; font-weight:400; line-height:1.2;">
                Struwwelpeter Kronach
              </div>
            </td>

          </tr>
        </table>
      </td>
    </tr>

    <!-- ======================================================
         SEKTION 3: DUNKLER FOOTER — Logos · Hashtag · IG
         ====================================================== -->
    <tr>
      <td style="background:#111111; padding:4px 20px;">
        <table width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>

            <!-- Logos links -->
            <td style="vertical-align:middle;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>

                  <!-- OAG Logo → openartgroup.de -->
                  <td style="vertical-align:middle; padding-right:6px;">
                    <a href="https://www.openartgroup.de"
                       target="_blank" rel="noopener noreferrer"
                       style="display:block; line-height:0;">
                      <img src="https://openartgroup.de/open%20art%20group%20(2).png"
                           alt="Open Art Group" width="42" height="42"
                           style="display:block; height:42px; width:auto; filter:invert(1);">
                    </a>
                  </td>

                  <!-- EU-Logo -->
                  <td style="vertical-align:middle; padding-right:8px;">
                    <img src="https://openartgroup.de/DE_FundedbytheEU_RGB_WHITE%20Outline.png"
                         alt="Finanziert von der Europäischen Union" width="78" height="22"
                         style="display:block; height:22px; width:auto;">
                  </td>

                  <!-- LCC -->
                  <td style="vertical-align:middle; padding-right:8px;">
                    <img src="https://openartgroup.de/LCC.png"
                         alt="LCC" width="34" height="22"
                         style="display:block; height:22px; width:auto; filter:brightness(0) invert(1);">
                  </td>

                  <!-- Struwwelpeter -->
                  <td style="vertical-align:middle;">
                    <img src="https://openartgroup.de/struwwel.png"
                         alt="JuZ Struwwelpeter Kronach" width="34" height="22"
                         style="display:block; height:22px; width:auto; filter:invert(1);">
                  </td>

                </tr>
              </table>
            </td>

            <!-- Rechts: Hashtag + Instagram-Icon -->

                           color:#ce4918; font-size:14px;
                           vertical-align:middle; margin-right:10px;">
                #OPENARTFESTIVAL

          </tr>

      </td>
    </tr>
