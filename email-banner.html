<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Art Festival 2026 — E-Mail-Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@300;400;900&display=swap" rel="stylesheet">
  <link href="https://openartgroup.de/networkand.css" rel="stylesheet">
  <style>
    body { margin: 0; padding: 40px 20px; background: #c8c5c0; font-family: sans-serif; }
    .preview-hint { text-align:center; color:#555; font-size:13px; margin-bottom:20px; }
  </style>
</head>
<body>

  <p class="preview-hint">Vorschau &amp; Signatur — Quellcode (Strg+U) in IONOS HTML-Editor einfügen.</p>

  <!-- Schriften als Body-Style (überlebt IONOS Head-Stripping) -->
  <style>
    @font-face {
      font-family: 'Networkand';
      src: url('NetworkFreeVersion.ttf') format('truetype'),
           url('https://openartgroup.de/NetworkFreeVersion.ttf') format('truetype');
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: 'Londrina Solid';
      src: url('https://openartgroup.de/fonts/londrina-solid-300.woff2') format('woff2');
      font-weight: 300;
      font-display: block;
    }
  </style>

  <table width="600" cellpadding="0" cellspacing="0" border="0" align="center"
    style="max-width:600px; width:100%; border-collapse:collapse; margin:0 auto;">

    <!-- HERO -->
    <tr>
      <td style="background:#f1eeea; padding:0;">
        <table width="600" cellpadding="0" cellspacing="0" border="0"
               style="width:100%; border-collapse:collapse;">
          <tr>
            <!-- Text links -->
            <td style="padding:32px 0 18px 24px; vertical-align:bottom; width:55%;">
              <div style="font-family:'Networkand','Permanent Marker',Impact,sans-serif;
                          font-size:64px; font-weight:400; color:#111111;
                          line-height:0.88;">
                OPEN<br>ART<br>FESTIVAL
              </div>
            </td>
            <!-- Scribble rechts – RGBA-PNG, kein mix-blend-mode nötig -->
            <td style="padding:0; vertical-align:top; text-align:right; width:45%;">
              <img src="https://openartgroup.de/Ebene%202.png"
                   alt="" width="280"
                   style="display:block; width:280px; height:auto; margin-left:auto;">
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- ORANGE BAR -->
    <tr>
      <td style="background:#ce4918; padding:13px 20px;">
        <table width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td style="vertical-align:middle; white-space:nowrap;">
              <a href="https://www.openartgroup.de/teilnahme.html"
                 target="_blank" rel="noopener noreferrer"
                 style="display:inline-block; background:#111111; color:#ffffff;
                        text-decoration:none; font-family:'Londrina Solid',sans-serif;
                        font-size:12px; font-weight:300; letter-spacing:0.03em;
                        padding:8px 18px; border-radius:50px; white-space:nowrap;">
                Zur Teilnahme
              </a>
              <span style="font-family:'Londrina Solid',sans-serif;
                           color:#ffffff; font-size:12px; font-weight:300; margin-left:8px;">
                Bewerbungsfrist &middot; 1. Juni 2026
              </span>
            </td>
            <td style="vertical-align:middle; text-align:right; white-space:nowrap;">
              <div style="font-family:'Networkand','Permanent Marker',Impact,sans-serif;
                          color:#ffffff; font-size:17px; font-weight:400; line-height:1.2;">
                25.–26.07.2026
              </div>
              <div style="font-family:'Networkand','Permanent Marker',Impact,sans-serif;
                          color:#ffffff; font-size:17px; font-weight:400; line-height:1.2;">
                Struwwelpeter Kronach
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- DARK FOOTER -->

      <td style="background:#111111; padding:4px 20px;">
        <table width="100%" cellpadding="0" cellspacing="0" border="0">

                    </a>

                         alt="Finanziert von der Europäischen Union" width="78" height="22"
                         style="display:block; height:22px; width:auto;">
                  </td>
                  <td style="vertical-align:middle; padding-right:8px;">
                    <img src="https://openartgroup.de/LCC.png"
                         alt="LCC" width="34" height="22"
                         style="display:block; height:22px; width:auto; filter:brightness(0) invert(1);">
                  </td>
                  <td style="vertical-align:middle;">

                         alt="JuZ Struwwelpeter Kronach" width="34" height="22"
                         style="display:block; height:22px; width:auto; filter:invert(1);">
                  </td>
                </tr>
