<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Art Festival 2026 — E-Mail-Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@300;400;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Networkand';
      src: url('NetworkFreeVersion.ttf') format('truetype');
      font-weight: 400;
      font-display: block;
    }
    body { margin: 0; padding: 40px 20px; background: #c8c5c0; font-family: sans-serif; }
    .preview-hint { text-align:center; color:#555; font-size:13px; margin-bottom:20px; }
  </style>
</head>
<body>

  <p class="preview-hint">Vorschau — Kopiere den Inhalt zwischen den Kommentaren in dein E-Mail-Programm.</p>

  <!-- ============================================================
       EMAIL BANNER START — diesen Block in die Signatur einfügen
       ============================================================ -->

  <table width="600" cellpadding="0" cellspacing="0" border="0" align="center"
    style="max-width:600px; width:100%; border-collapse:collapse; margin:0 auto;">

    <!-- ======================================================
         SEKTION 1: HERO — beige, großes Festival-Wortbild
         ====================================================== -->
    <tr>
      <td style="background:#f1eeea; padding:22px 24px 10px 24px;">

        <table width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <!-- ALLE drei Wörter in EINER Zelle — Zeilenabstand nur durch line-height, nie wieder durch Tabellenzeilen -->
            <td style="font-family:'Networkand','Permanent Marker',Impact,sans-serif;
                       font-size:64px; font-weight:400; color:#111111;
                       line-height:0.88; vertical-align:top; width:60%;">
              OPEN<br>ART<br>FESTIVAL
            </td>
            <!-- Scribble rechts oben -->
            <td style="vertical-align:top; text-align:right; width:40%;">
              <img src="https://www.openartgroup.de/Ebene%202.png"
                   alt="" width="195"
                   style="display:block; width:195px; height:auto; margin-left:auto;
                          mix-blend-mode:multiply; -webkit-mix-blend-mode:multiply;">
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- ======================================================
         SEKTION 2: ORANGE BAR — Button · Frist · Datum/Ort
         ====================================================== -->
    <tr>
      <td style="background:#ce4918; padding:13px 20px;">
        <table width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>

            <!-- Button "Zur Teilnahme" → Anmeldeformular -->
            <td style="vertical-align:middle; white-space:nowrap; padding-right:6px;">
              <a href="https://www.openartgroup.de/teilnahme.html"
                 target="_blank" rel="noopener noreferrer"
                 style="display:inline-block;
                        background:#111111; color:#ffffff; text-decoration:none;
                        font-family:'Londrina Solid',sans-serif;
                        font-size:12px; font-weight:300; letter-spacing:0.03em;
                        padding:8px 18px; border-radius:50px; white-space:nowrap;">
                Zur Teilnahme
              </a>
            </td>

            <!-- Bewerbungsschluss — kein Abstand zum Button -->
            <td style="vertical-align:middle; white-space:nowrap; padding-left:0; padding-right:6px;">
              <span style="font-family:'Londrina Solid',sans-serif;
                           color:#ffffff; font-size:12px; font-weight:300;">
                Bewerbungsschluss &middot; 1. Juni 2026
              </span>
            </td>

            <!-- Datum + Ort — WEISS, etwas größer -->
            <td style="vertical-align:middle; text-align:right; white-space:nowrap;">
              <div style="font-family:'Networkand','Permanent Marker',Impact,sans-serif;
                          color:#ffffff; font-size:17px; font-weight:400; line-height:1.2;">
                25.–26.07.2026
              </div>
              <div style="font-family:'Networkand','Permanent Marker',Impact,sans-serif;
                          color:#ffffff; font-size:17px; font-weight:400; line-height:1.2;">
                Struwwelpeter Kronach
              </div>
            </td>

          </tr>
        </table>
      </td>
    </tr>

    <!-- ======================================================
         SEKTION 3: DUNKLER FOOTER — Logos · Hashtag · IG
         ====================================================== -->
    <tr>
      <td style="background:#111111; padding:4px 20px;">
        <table width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>

            <!-- Logos links -->
            <td style="vertical-align:middle;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>

                  <!-- OAG Logo → openartgroup.de -->
                  <td style="vertical-align:middle; padding-right:6px;">
                    <a href="https://www.openartgroup.de"
                       target="_blank" rel="noopener noreferrer"
                       style="display:block; line-height:0;">
                      <img src="https://www.openartgroup.de/open%20art%20group%20(2).png"
                           alt="Open Art Group" width="42" height="42"
                           style="display:block; height:42px; width:auto; filter:invert(1);">
                    </a>
                  </td>

                  <!-- EU-Logo -->
                  <td style="vertical-align:middle; padding-right:8px;">
                    <img src="https://www.openartgroup.de/DE_FundedbytheEU_RGB_WHITE%20Outline.png"
                         alt="Finanziert von der Europäischen Union"
                         style="display:block; height:22px; width:auto;">
                  </td>

                  <!-- LCC -->
                  <td style="vertical-align:middle; padding-right:8px;">
                    <img src="https://www.openartgroup.de/LCC.png"
                         alt="LCC"
                         style="display:block; height:22px; width:auto; filter:brightness(0) invert(1);">
                  </td>

                  <!-- Struwwelpeter -->
                  <td style="vertical-align:middle;">
                    <img src="https://www.openartgroup.de/struwwel.png"
                         alt="JuZ Struwwelpeter Kronach"
                         style="display:block; height:22px; width:auto; filter:invert(1);">
                  </td>

                </tr>
              </table>
            </td>

            <!-- Rechts: Hashtag + Instagram-Icon -->
            <td style="vertical-align:middle; text-align:right; white-space:nowrap;">

              <span style="font-family:'Networkand','Permanent Marker',Impact,sans-serif;
                           color:#ce4918; font-size:14px;
                           vertical-align:middle; margin-right:10px;">
                #OPENARTFESTIVAL
              </span>

              <!-- Instagram-Kreis-Icon → Instagram -->
              <a href="https://www.instagram.com/open_art_group/"
                 target="_blank" rel="noopener noreferrer"
                 style="display:inline-block; vertical-align:middle;
                        width:34px; height:34px; border-radius:50%;
                        border:1.5px solid #ffffff;
                        text-align:center; line-height:0;
                        padding:7px; box-sizing:border-box;">
                <svg viewBox="0 0 36 36" width="18" height="18"
                     fill="none" stroke="#ffffff"
                     stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10,5.5 C7.2,5.1 5.1,7.3 5,10 L5,26 C4.9,28.8 7.1,31 10,31 L26,31 C28.8,31.1 31,28.9 31,26 L31,10 C31.1,7.2 28.9,5 26,5 Z"/>
                  <circle cx="18" cy="18" r="6.5"/>
                  <circle cx="26.5" cy="9.5" r="1.5" fill="#ffffff" stroke="none"/>
                </svg>
              </a>

            </td>

          </tr>
        </table>
      </td>
    </tr>

  </table>

  <!-- ============================================================
       EMAIL BANNER END
       ============================================================ -->

</body>
</html>
