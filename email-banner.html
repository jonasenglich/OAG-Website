<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Art Group — E-Mail-Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@300;400;900&display=swap');
    @font-face {
      font-family: 'Network';
      src: url('https://www.openartgroup.de/NetworkFreeVersion.ttf') format('truetype');
      font-weight: 400 900;
    }
    body { margin: 0; padding: 40px 20px; background: #e0ddd9; font-family: 'Londrina Solid', sans-serif; }
    .preview-hint { text-align:center; color:#666; font-size:13px; margin-bottom:20px; font-family: sans-serif; }
  </style>
</head>
<body>

  <p class="preview-hint">Vorschau — Kopiere den Inhalt zwischen den Kommentaren in dein E-Mail-Programm.</p>

  <!-- ============================================================
       EMAIL BANNER START — diesen Block in die Signatur einfügen
       ============================================================ -->

  <table width="600" cellpadding="0" cellspacing="0" border="0" align="center"
    style="max-width:600px; width:100%; border-collapse:collapse; margin:0 auto; background:#f1eeea; font-family:'Londrina Solid',sans-serif;">

    <!-- Orange Streifen oben -->
    <tr>
      <td colspan="2" style="background:#ce4918; height:6px; font-size:1px; line-height:1px;">&nbsp;</td>
    </tr>

    <!-- Header: Logo links + Festivalname rechts -->
    <tr>
      <td style="background:#f1eeea; padding:20px 20px 16px 24px; vertical-align:middle; width:45%;">
        <img src="https://www.openartgroup.de/open%20art%20group%20(2).png"
          alt="Open Art Group"
          width="180"
          style="display:block; width:180px; height:auto;">
      </td>
      <td style="background:#111111; padding:24px 24px 20px 20px; vertical-align:middle; width:55%; text-align:right;">
        <div style="font-family:'Londrina Solid',sans-serif; color:#f1eeea; font-size:11px; text-transform:uppercase; letter-spacing:0.14em; margin-bottom:10px; opacity:0.6;">
          Kronach
        </div>
        <div style="font-family:'Network','Permanent Marker',Impact,sans-serif; color:#f1eeea; font-size:26px; font-weight:400; text-transform:uppercase; letter-spacing:0.03em; line-height:0.95; margin-bottom:12px;">
          Open Art<br>Festival 2026
        </div>
        <div style="font-family:'Londrina Solid',sans-serif; color:#ce4918; font-size:20px; font-weight:900; letter-spacing:0.06em;">
          25.–26.07.2026
        </div>
      </td>
    </tr>

    <!-- Gelber Streifen -->
    <tr>
      <td colspan="2" style="background:#dfaf22; height:4px; font-size:1px; line-height:1px;">&nbsp;</td>
    </tr>

    <!-- Termine -->
    <tr>
      <td colspan="2" style="padding:22px 24px 26px 24px; background:#f1eeea;">

        <div style="font-family:'Londrina Solid',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:0.18em; color:#ce4918; margin-bottom:16px; font-weight:900;">
          — Termine
        </div>

        <!-- Kick-Off -->
        <table cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-bottom:14px;">
          <tr>
            <td style="vertical-align:top; padding-right:12px; padding-top:4px; width:12px;">
              <div style="width:9px; height:9px; background:#ce4918; border-radius:50%;"></div>
            </td>
            <td>
              <div style="font-family:'Londrina Solid',sans-serif; font-size:12px; color:#111111; font-weight:900; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:2px;">
                Kick-Off Festival-Planung
              </div>
              <div style="font-family:'Londrina Solid',sans-serif; font-size:16px; color:#111111; font-weight:400;">
                06.05.2026, 18:00 Uhr
              </div>
              <div style="font-family:'Londrina Solid',sans-serif; font-size:14px; color:#666666; font-weight:300;">
                Struwwelpeter Kronach
              </div>
            </td>
          </tr>
        </table>

        <!-- Anmeldeschluss -->
        <table cellpadding="0" cellspacing="0" border="0" width="100%">
          <tr>
            <td style="vertical-align:top; padding-right:12px; padding-top:4px; width:12px;">
              <div style="width:9px; height:9px; background:#dfaf22; border-radius:50%;"></div>
            </td>
            <td>
              <div style="font-family:'Londrina Solid',sans-serif; font-size:12px; color:#111111; font-weight:900; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:2px;">
                Anmeldeschluss Open Art Festival
              </div>
              <div style="font-family:'Londrina Solid',sans-serif; font-size:16px; color:#111111; font-weight:400;">
                01.06.2026
              </div>
            </td>
          </tr>
        </table>

      </td>
    </tr>

    <!-- Trennlinie -->
    <tr>
      <td colspan="2" style="background:#111111; height:1px; font-size:1px; line-height:1px;">&nbsp;</td>
    </tr>

    <!-- Footer-Links -->
    <tr>
      <td colspan="2" style="background:#111111; padding:14px 24px;">
        <table cellpadding="0" cellspacing="0" border="0" width="100%">
          <tr>
            <!-- Instagram -->
            <td style="text-align:center; padding:0 5px;">
              <a href="https://www.instagram.com/open_art_group/"
                target="_blank" rel="noopener noreferrer"
                style="display:inline-block; color:#f1eeea; text-decoration:none; font-family:'Londrina Solid',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:0.1em; padding:7px 12px; border:1px solid rgba(241,238,234,0.3); border-radius:4px;">
                &#128247;&nbsp; Instagram
              </a>
            </td>
            <!-- Website -->
            <td style="text-align:center; padding:0 5px;">
              <a href="https://www.openartgroup.de"
                target="_blank" rel="noopener noreferrer"
                style="display:inline-block; color:#f1eeea; text-decoration:none; font-family:'Londrina Solid',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:0.1em; padding:7px 12px; border:1px solid rgba(241,238,234,0.3); border-radius:4px;">
                &#127760;&nbsp; Website
              </a>
            </td>
            <!-- Noch Fragen? -->
            <td style="text-align:center; padding:0 5px;">
              <a href="mailto:info@openartgroup.de"
                style="display:inline-block; color:#dfaf22; text-decoration:none; font-family:'Londrina Solid',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:0.1em; padding:7px 12px; border:1px solid rgba(223,175,34,0.4); border-radius:4px;">
                ✉&nbsp; Noch Fragen?
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Orange Streifen unten -->
    <tr>
      <td colspan="2" style="background:#ce4918; height:4px; font-size:1px; line-height:1px;">&nbsp;</td>
    </tr>

  </table>

  <!-- ============================================================
       EMAIL BANNER END
       ============================================================ -->

</body>
</html>
